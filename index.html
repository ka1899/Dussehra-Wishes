<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Happy Dussehra - Victory of Good over Evil</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      background: radial-gradient(circle at 50% 30%, #1b1035, #080314 90%);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      overflow: hidden;
    }
    h1 {
      font-size: 2.2rem;
      letter-spacing: 2px;
      color: #ffd166;
      text-shadow: 0 0 15px rgba(255, 209, 102, 0.6);
      margin-bottom: 8px;
    }
    p {
      color: #e0d6ff;
      margin-bottom: 16px;
      font-size: 1rem;
    }
    canvas {
      border: 2px solid #4a2c82;
      border-radius: 12px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.7);
      background: #0d0722;
      max-width: 95vw;
      max-height: 70vh;
    }
    .controls {
      margin-top: 15px;
    }
    button {
      background: linear-gradient(135deg, #f77f00, #d62828);
      color: white;
      border: none;
      padding: 10px 24px;
      font-size: 1rem;
      font-weight: 600;
      border-radius: 25px;
      cursor: pointer;
      box-shadow: 0 4px 15px rgba(214, 40, 40, 0.4);
      transition: transform 0.2s, box-shadow 0.2s;
    }
    button:hover {
      transform: scale(1.05);
      box-shadow: 0 6px 20px rgba(247, 127, 0, 0.6);
    }
  </style>
</head>
<body>
  <h1>Happy Dussehra</h1>
  <p>Click "Release Arrow" or click the canvas to shoot!</p>
  <canvas id="stage" width="900" height="500"></canvas>
  <div class="controls">
    <button id="shootBtn">Release Divine Arrow</button>
  </div>

  <script>
    const canvas = document.getElementById('stage');
    const ctx = canvas.getContext('2d');

    // Positions & targets
    const ram = { x: 120, y: 340, bowRadius: 36 };
    const ravan = { x: 760, y: 310, width: 90, height: 160, hit: false, hp: 100 };
    
    // Target coordinate (Ravana's chest/navel)
    const target = { x: ravan.x, y: ravan.y - 20 };

    let arrow = null;
    let particles = [];

    // Compute angle from Ram to Ravana
    const dx = target.x - ram.x;
    const dy = target.y - ram.y;
    const aimAngle = Math.atan2(dy, dx);

    function triggerShoot() {
      if (arrow && !arrow.landed) return;
      arrow = {
        x: ram.x + Math.cos(aimAngle) * 30,
        y: ram.y + Math.sin(aimAngle) * 30,
        angle: aimAngle,
        speed: 16,
        landed: false
      };
      ravan.hit = false;
    }

    document.getElementById('shootBtn').addEventListener('click', triggerShoot);
    canvas.addEventListener('click', triggerShoot);

    function createExplosion(x, y) {
      for (let i = 0; i < 40; i++) {
        const angle = Math.random() * Math.PI * 2;
        const speed = 1.5 + Math.random() * 4.5;
        particles.push({
          x: x,
          y: y,
          vx: Math.cos(angle) * speed,
          vy: Math.sin(angle) * speed - 1.5,
          color: ['#ffbe0b', '#fb5607', '#ff006e', '#ffeaa7'][Math.floor(Math.random() * 4)],
          life: 1.0,
          decay: 0.02 + Math.random() * 0.02
        });
      }
    }

    function drawRam() {
      ctx.save();
      ctx.translate(ram.x, ram.y);

      // Aura / Halo
      ctx.beginPath();
      ctx.arc(0, -60, 26, 0, Math.PI * 2);
      ctx.fillStyle = 'rgba(255, 215, 0, 0.25)';
      ctx.fill();

      // Body (Lord Ram)
      ctx.fillStyle = '#64b5f6'; // Divine soft blue complexion
      ctx.beginPath();
      ctx.arc(0, -60, 16, 0, Math.PI * 2); // Head
      ctx.fill();

      ctx.fillStyle = '#f39c12'; // Dhoti / Attire
      ctx.fillRect(-12, -44, 24, 46);

      // Bow rotated to aim directly at Ravana
      ctx.rotate(aimAngle);

      // Bow Arc
      ctx.strokeStyle = '#d4af37';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.arc(10, 0, ram.bowRadius, -Math.PI / 2.3, Math.PI / 2.3, false);
      ctx.stroke();

      // Bow String
      ctx.strokeStyle = '#f1faee';
      ctx.lineWidth = 1.5;
      ctx.beginPath();
      ctx.moveTo(10 + Math.cos(-Math.PI / 2.3) * ram.bowRadius, Math.sin(-Math.PI / 2.3) * ram.bowRadius);
      ctx.lineTo(-6, 0); // Pulled back notch
      ctx.lineTo(10 + Math.cos(Math.PI / 2.3) * ram.bowRadius, Math.sin(Math.PI / 2.3) * ram.bowRadius);
      ctx.stroke();

      // Nocked Arrow (visible before release)
      if (!arrow || arrow.landed) {
        ctx.strokeStyle = '#ffdd59';
        ctx.lineWidth = 3;
        ctx.beginPath();
        ctx.moveTo(-6, 0);
        ctx.lineTo(38, 0);
        ctx.stroke();

        // Arrow tip
        ctx.fillStyle = '#ff3838';
        ctx.beginPath();
        ctx.moveTo(42, 0);
        ctx.lineTo(34, -4);
        ctx.lineTo(34, 4);
        ctx.closePath();
        ctx.fill();
      }

      ctx.restore();
    }

    function drawRavan() {
      ctx.save();
      ctx.translate(ravan.x, ravan.y);

      // Effigy Body
      ctx.fillStyle = raanColor();
      ctx.fillRect(-22, -60, 44, 70);

      // Multiple heads (10 heads silhouette representation)
      for (let i = -4; i <= 4; i++) {
        const offset = i * 11;
        const headRadius = (i === 0) ? 14 : 9;
        ctx.beginPath();
        ctx.arc(offset, -78 - Math.abs(i) * 2, headRadius, 0, Math.PI * 2);
        ctx.fillStyle = '#d35400';
        ctx.fill();
        ctx.strokeStyle = '#f1c40f';
        ctx.stroke();
      }

      // Crown on central head
      ctx.fillStyle = '#f1c40f';
      ctx.beginPath();
      ctx.moveTo(-10, -92);
      ctx.lineTo(0, -108);
      ctx.lineTo(10, -92);
      ctx.closePath();
      ctx.fill();

      ctx.restore();
    }

    function raanColor() {
      return ravan.hit ? '#e74c3c' : '#8e44ad';
    }

    function drawArrow(ar) {
      ctx.save();
      ctx.translate(ar.x, ar.y);
      ctx.rotate(ar.angle);

      // Shaft
      ctx.strokeStyle = '#ffd32a';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(-30, 0);
      ctx.lineTo(10, 0);
      ctx.stroke();

      // Divine Glowing Arrow Tip
      ctx.fillStyle = '#ff3838';
      ctx.shadowColor = '#ff9f1a';
      ctx.shadowBlur = 12;
      ctx.beginPath();
      ctx.moveTo(16, 0);
      ctx.lineTo(6, -5);
      ctx.lineTo(6, 5);
      ctx.closePath();
      ctx.fill();

      // Fletching (feathers)
      ctx.shadowBlur = 0;
      ctx.strokeStyle = '#00d2d3';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.moveTo(-28, -4);
      ctx.lineTo(-22, 0);
      ctx.lineTo(-28, 4);
      ctx.stroke();

      ctx.restore();
    }

    function update() {
      // Clear frame
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      // Ground line
      ctx.strokeStyle = '#3d2667';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(0, 390);
      ctx.lineTo(canvas.width, 390);
      ctx.stroke();

      // Update arrow trajectory
      if (arrow && !arrow.landed) {
        arrow.x += Math.cos(arrow.angle) * arrow.speed;
        arrow.y += Math.sin(arrow.angle) * arrow.speed;

        // Collision detection with Ravana's target box
        const hitDist = Math.hypot(arrow.x - target.x, arrow.y - target.y);
        if (hitDist < 20 || arrow.x >= target.x) {
          arrow.landed = true;
          ravan.hit = true;
          createExplosion(target.x, target.y);
        }
      }

      // Draw entities
      drawRam();
      drawRavan();
      if (arrow && !arrow.landed) {
        drawArrow(arrow);
      }

      // Update and draw spark/fire particles
      for (let i = particles.length - 1; i >= 0; i--) {
        const p = particles[i];
        p.x += p.vx;
        p.y += p.vy;
        p.life -= p.decay;

        if (p.life <= 0) {
          particles.splice(i, 1);
          continue;
        }

        ctx.save();
        ctx.globalAlpha = p.life;
        ctx.fillStyle = p.color;
        ctx.beginPath();
        ctx.arc(p.x, p.y, 3, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
      }

      requestAnimationFrame(update);
    }

    update();
  </script>
</body>
</html>
